# Template only — replace CHANGE_ME values before applying, then avoid committing
# the filled-in version. Prefer creating it out-of-band, e.g.:
#
#   oc create secret generic classic-models-api-secrets -n classic-models \
#     --from-literal=SECRET_KEY='<django-secret-key>' \
#     --from-literal=API_KEY='<api-key>' \
#     --from-literal=DATABASE_URL='mysql://classicuser:<password>@mysql:3306/classicmodels' \
#     --from-literal=MYSQL_USER='classicuser' \
#     --from-literal=MYSQL_PASSWORD='<password>' \
#     --from-file=JWT_PRIVATE_KEY_PEM=./secrets/jwt/jwt_private.pem \
#     --from-file=JWT_PUBLIC_KEY_PEM=./secrets/jwt/jwt_public.pem
#
# Generate SECRET_KEY: python -c "import secrets; print(secrets.token_urlsafe(50))"
# Generate API_KEY:    python -c "import secrets; print(secrets.token_urlsafe(32))"
#
# JWT_PRIVATE_KEY_PEM/JWT_PUBLIC_KEY_PEM are optional: omit them (and the matching
# env vars in 02-deployment.yaml) to fall back to HS256 signing via SECRET_KEY.
apiVersion: v1
kind: Secret
metadata:
  name: classic-models-api-secrets
  namespace: classic-models
  labels:
    app.kubernetes.io/name: classic-models-api
    app.kubernetes.io/instance: classic-models-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: classic-models-api
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME"
  API_KEY: "CHANGE_ME"
  MYSQL_USER: "classicuser"
  MYSQL_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "mysql://classicuser:CHANGE_ME@mysql:3306/classicmodels"
  JWT_PRIVATE_KEY_PEM: ""
  JWT_PUBLIC_KEY_PEM: ""
