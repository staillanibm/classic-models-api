apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: classic-models
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: classic-models-mysql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: classic-models-api
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: classic-models-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
