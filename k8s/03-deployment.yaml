apiVersion: apps/v1
kind: Deployment
metadata:
  name: classic-models-api
  namespace: classic-models
  labels:
    app.kubernetes.io/name: classic-models-api
    app.kubernetes.io/instance: classic-models-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: classic-models-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: classic-models-api
      app.kubernetes.io/instance: classic-models-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classic-models-api
        app.kubernetes.io/instance: classic-models-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: classic-models-api
    spec:
      # No fsGroup/runAsUser pinned: OCP's restricted-v2 SCC assigns a
      # namespace-scoped arbitrary UID/GID automatically at admission time.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: classic-models-api
          image: image-registry.openshift-image-registry.svc:5000/classic-models/classic-models-api:latest
          # Always: the tag is a floating "latest" on the internal ImageStream,
          # so the kubelet must not reuse a stale cached image with the same tag.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: classic-models-api-config
            - secretRef:
                name: classic-models-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /classic-models/health/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /classic-models/health/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /classic-models/health/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
