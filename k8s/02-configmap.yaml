apiVersion: v1
kind: ConfigMap
metadata:
  name: classic-models-api-config
  namespace: classic-models
  labels:
    app.kubernetes.io/name: classic-models-api
    app.kubernetes.io/instance: classic-models-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: classic-models-api
data:
  DJANGO_SETTINGS_MODULE: "config.settings.production"
  DEBUG: "0"
  API_VERSION: "4.7.0"
  ALLOWED_HOSTS: "*"
  JWT_ISSUER: "https://your-issuer.example.com"
  JWT_AUDIENCE: "classic-models-api"
  JWT_LEEWAY_SECONDS: "0"
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "classicmodels"
  OTEL_SERVICE_NAME: "classic-models-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger.observability.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
