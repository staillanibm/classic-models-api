{{- if .Values.kafka.enabled }}
# Kafka credentials, materialised where the relay can mount them.
#
# Strimzi generates the SCRAM password and the cluster CA in the kafka
# namespace, and a Secret cannot be mounted across namespaces. Rather than
# copying the password — which then drifts the first time the KafkaUser is
# regenerated — External Secrets reads both from their source and keeps this
# copy following them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: classic-models-api-kafka
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "classic-models-api.apiLabels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.kafka.secretStore }}
  target:
    name: {{ .Values.kafka.credentialsSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        # The KafkaUser's secret carries the same name as the user.
        key: {{ .Values.kafka.username }}
        property: password
    - secretKey: ca.crt
      remoteRef:
        # The cluster's own CA, so the relay verifies the broker rather than
        # trusting whatever answers on that address.
        key: {{ .Values.kafka.caSecret }}
        property: ca.crt
{{- end }}
