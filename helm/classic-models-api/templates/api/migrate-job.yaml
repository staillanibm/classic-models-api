apiVersion: batch/v1
kind: Job
metadata:
  name: classic-models-api-migrate
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "classic-models-api.apiLabels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Runs once before every install/upgrade, ahead of the Deployment rollout,
    # so no two API replicas ever race to run `manage.py migrate` concurrently.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "classic-models-api.apiLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["bash", "/app/scripts/migrate.sh"]
          envFrom:
            - configMapRef:
                name: classic-models-api-config
            - secretRef:
                name: classic-models-api-secrets
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
