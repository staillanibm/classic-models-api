apiVersion: batch/v1
kind: Job
metadata:
  name: classic-models-api-migrate
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "classic-models-api.apiLabels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Runs once after every install/upgrade, as a post-install/post-upgrade
    # hook: by then MySQL/Secrets/ConfigMaps (plain resources, applied before
    # any hook fires) already exist, so the migrate.sh MySQL-wait loop has
    # something to actually wait for. A pre-install/pre-upgrade hook would run
    # before those plain resources exist at all, on the very first install.
    # The API Deployment's startupProbe (failureThreshold: 30, ~150s) covers
    # the short window where pods are up but migrations haven't finished yet
    # — no separate lock is needed since this Job itself is never run twice
    # concurrently for the same release.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "classic-models-api.apiLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        {{- if .Values.api.runAsUser }}
        runAsUser: {{ .Values.api.runAsUser }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.api.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.api.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["bash", "/app/scripts/migrate.sh"]
          envFrom:
            - configMapRef:
                name: classic-models-api-config
            - secretRef:
                name: classic-models-api-secrets
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
