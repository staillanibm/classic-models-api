{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: classic-models-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "classic-models-api.apiLabels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "httpRoute.gateway.name is required when httpRoute.enabled is true" .Values.httpRoute.gateway.name }}
      {{- if .Values.httpRoute.gateway.namespace }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      {{- end }}
      {{- if .Values.httpRoute.gateway.sectionName }}
      sectionName: {{ .Values.httpRoute.gateway.sectionName }}
      {{- end }}
  {{- if .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  {{- end }}
  rules:
    {{- if and .Values.api.metrics.enabled .Values.api.metrics.blockExternal }}
    # Most specific rule first: Gateway API gives an Exact match priority over
    # the "/" PathPrefix. This redirects /metrics away instead of proxying it,
    # so the endpoint stays reachable in-cluster (Prometheus scrapes the pod IP
    # directly, bypassing the gateway) but not from the outside.
    - matches:
        - path:
            type: Exact
            value: {{ .Values.api.metrics.path | quote }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /classic-models/health/
            statusCode: 302
    {{- end }}
    - matches:
        - path:
            type: {{ .Values.httpRoute.pathType }}
            value: {{ .Values.httpRoute.path }}
      backendRefs:
        - name: classic-models-api
          port: 8000
{{- end }}
