apiVersion: v1
kind: ConfigMap
metadata:
  name: classic-models-api-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "classic-models-api.apiLabels" . | nindent 4 }}
  annotations:
    # Ordered (not deleted) like a hook so it exists before the migrate Job
    # hook runs, while still persisting as a normal release resource.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
data:
  DJANGO_SETTINGS_MODULE: "config.settings.production"
  DEBUG: {{ .Values.api.config.debug | quote }}
  API_VERSION: {{ .Values.api.config.apiVersion | quote }}
  ALLOWED_HOSTS: {{ .Values.api.config.allowedHosts | quote }}
  SECURE_SSL_REDIRECT: {{ .Values.api.secureSslRedirect | ternary "1" "0" | quote }}
  JWT_ISSUER: {{ .Values.api.config.jwtIssuer | quote }}
  JWT_AUDIENCE: {{ .Values.api.config.jwtAudience | quote }}
  JWT_LEEWAY_SECONDS: {{ .Values.api.config.jwtLeewaySeconds | quote }}
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: {{ .Values.mysql.database | quote }}
  GUNICORN_WORKERS: {{ .Values.api.gunicorn.workers | quote }}
  GUNICORN_TIMEOUT: {{ .Values.api.gunicorn.timeout | quote }}
