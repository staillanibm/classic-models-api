apiVersion: v1
kind: ConfigMap
metadata:
  name: classic-models-api-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "classic-models-api.apiLabels" . | nindent 4 }}
data:
  DJANGO_SETTINGS_MODULE: "config.settings.production"
  DEBUG: {{ .Values.api.config.debug | quote }}
  API_VERSION: {{ .Values.api.config.apiVersion | quote }}
  ALLOWED_HOSTS: {{ .Values.api.config.allowedHosts | quote }}
  SECURE_SSL_REDIRECT: {{ .Values.api.secureSslRedirect | ternary "1" "0" | quote }}
  JWT_ISSUER: {{ .Values.api.config.jwtIssuer | quote }}
  JWT_AUDIENCE: {{ .Values.api.config.jwtAudience | quote }}
  JWT_LEEWAY_SECONDS: {{ .Values.api.config.jwtLeewaySeconds | quote }}
  {{- if .Values.api.config.jwtJwkUrl }}
  JWT_JWK_URL: {{ .Values.api.config.jwtJwkUrl | quote }}
  {{- end }}
  {{- if .Values.api.config.jwtRolesClaimPath }}
  JWT_ROLES_CLAIM_PATH: {{ .Values.api.config.jwtRolesClaimPath | quote }}
  {{- end }}
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: {{ .Values.mysql.database | quote }}
  GUNICORN_WORKERS: {{ .Values.api.gunicorn.workers | quote }}
  GUNICORN_TIMEOUT: {{ .Values.api.gunicorn.timeout | quote }}
  {{- if .Values.api.metrics.enabled }}
  PROMETHEUS_MULTIPROC_DIR: {{ .Values.api.metrics.multiprocDir | quote }}
  {{- end }}
  {{- if .Values.api.otel.enabled }}
  OTEL_SERVICE_NAME: {{ .Values.api.otel.serviceName | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.api.otel.endpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.api.otel.protocol | quote }}
  OTEL_TRACES_EXPORTER: "otlp"
  # Injects otelTraceID/otelSpanID into Python LogRecords: this is what feeds
  # the Loki datasource's TraceID derived field (log -> trace). Does not cover
  # gunicorn access logs, which have their own formatting.
  OTEL_PYTHON_LOG_CORRELATION: "true"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  {{- end }}
