apiVersion: v1
kind: Secret
metadata:
  name: classic-models-api-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "classic-models-api.apiLabels" . | nindent 4 }}
  annotations:
    # Ordered (not deleted) like a hook so it exists before the migrate Job
    # hook runs, while still persisting as a normal release resource.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
type: Opaque
stringData:
  SECRET_KEY: {{ include "classic-models-api.secretValue" (dict "namespace" .Values.namespace "secretName" "classic-models-api-secrets" "key" "SECRET_KEY" "explicit" .Values.secrets.secretKey "length" 50) | quote }}
  API_KEY: {{ include "classic-models-api.secretValue" (dict "namespace" .Values.namespace "secretName" "classic-models-api-secrets" "key" "API_KEY" "explicit" .Values.secrets.apiKey "length" 32) | quote }}
  JWT_PRIVATE_KEY_PEM: {{ .Values.secrets.jwtPrivateKeyPem | quote }}
  JWT_PUBLIC_KEY_PEM: {{ .Values.secrets.jwtPublicKeyPem | quote }}
