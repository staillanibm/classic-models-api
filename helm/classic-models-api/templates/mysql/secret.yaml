apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "classic-models-api.mysqlLabels" . | nindent 4 }}
  annotations:
    # Ordered (not deleted) like a hook so it exists before the migrate Job
    # hook runs, while still persisting as a normal release resource.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ include "classic-models-api.secretValue" (dict "namespace" .Values.namespace "secretName" "mysql-credentials" "key" "MYSQL_ROOT_PASSWORD" "explicit" .Values.secrets.mysqlRootPassword "length" 32) | quote }}
  MYSQL_DATABASE: {{ .Values.mysql.database | quote }}
  MYSQL_USER: {{ .Values.mysql.user | quote }}
  MYSQL_PASSWORD: {{ include "classic-models-api.secretValue" (dict "namespace" .Values.namespace "secretName" "mysql-credentials" "key" "MYSQL_PASSWORD" "explicit" .Values.secrets.mysqlPassword "length" 32) | quote }}
