{{- if .Values.kafka.enabled }}
# The topics this API publishes on, and the account it publishes with.
#
# They live in this chart because this API owns them: it defines the events
# (see docs/DOMAIN_EVENTS.md), so it defines where they land and what may write
# them. The Kafka repo deploys a cluster and holds no opinion about who uses it.
#
# The CRs are created in the operator's namespace — Strimzi runs with
# `watchAnyNamespace=false`, so one anywhere else is ignored, silently.
#
# Declared, never auto-created: the account below has no `Create` ACL, so a
# producer would simply be denied, and an auto-created topic takes broker
# defaults nobody chose.
#
# Partition count is the ceiling on consumer parallelism and cannot be lowered
# later, so it is set for the traffic expected rather than the traffic today.
{{- range $topic := .Values.kafka.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ $topic.name }}
  namespace: {{ $.Values.kafka.namespace }}
  labels:
    strimzi.io/cluster: {{ $.Values.kafka.cluster }}
  annotations:
    # These hold data. Uninstalling the API must not take the estate's event
    # history with it.
    helm.sh/resource-policy: keep
spec:
  partitions: {{ $topic.partitions }}
  replicas: {{ $topic.replicas }}
  config:
    retention.ms: {{ $topic.retentionMs | quote }}
    cleanup.policy: delete
    min.insync.replicas: "1"
{{- end }}
---
# Write and Describe only, on this API's prefix. It publishes domain events and
# consumes nothing: a producer that could also read every topic exfiltrates
# every other domain's events if it is ever compromised. Describe is needed for
# metadata and grants no reads.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ .Values.kafka.username }}
  namespace: {{ .Values.kafka.namespace }}
  labels:
    strimzi.io/cluster: {{ .Values.kafka.cluster }}
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: {{ .Values.kafka.topicPrefix }}
          patternType: prefix
        operations:
          - Write
          - Describe
{{- end }}
