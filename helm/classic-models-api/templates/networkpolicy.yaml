apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: classic-models-api-allow-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "classic-models-api.apiLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: classic-models-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-allow-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "classic-models-api.mysqlLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              # The relay reads the outbox from the same database, under its own
              # name. Selecting on the exact API label alone would have left it
              # unable to reach MySQL, and a NetworkPolicy denies silently — it
              # would have looked like a database that never answers.
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - classic-models-api
                  - classic-models-api-outbox-relay
      ports:
        - protocol: TCP
          port: 3306
