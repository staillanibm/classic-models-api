namespace: classic-models

api:
  image:
    repository: image-registry.openshift-image-registry.svc:5000/classic-models/classic-models-api
    tag: latest
    pullPolicy: Always
  # Names of pre-existing `kubernetes.io/dockerconfigjson` Secrets in this
  # release's namespace, for pulling api.image from a private registry.
  # The chart does not create these secrets — create them yourself, e.g.:
  #   kubectl create secret docker-registry ghcr-pull-secret \
  #     --docker-server=ghcr.io --docker-username=<user> --docker-password=<token> \
  #     -n <namespace>
  imagePullSecrets: []
  # Set to run containers as a fixed non-root UID, for clusters without a
  # mechanism that assigns one automatically (unlike OpenShift's
  # restricted-v2 SCC, which injects a namespace-scoped UID at admission —
  # the image itself has no USER directive and defaults to root). Leave
  # empty on OpenShift.
  runAsUser: ""
  replicas: 2
  gunicorn:
    workers: 3
    timeout: 30
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    debug: "0"
    apiVersion: "4.7.0"
    allowedHosts: "*"
    jwtIssuer: "https://your-issuer.example.com"
    jwtAudience: "classic-models-api"
    jwtLeewaySeconds: "0"
    # Set to enable RS256 verification via an external OIDC IdP's JWKS
    # endpoint (Keycloak, Auth0, Entra ID...) instead of the internal
    # login/refresh flow's own signing key. Leave empty to keep using only
    # the internal HS256/RS256 flow (authentication.views).
    jwtJwkUrl: ""
    # Dot-separated claim path carrying role names for RBAC group sync
    # (authentication.oidc_auth). Defaults to Keycloak's realm_access.roles
    # when unset.
    jwtRolesClaimPath: ""
  # Set to enforce HTTPS-only redirects (only if fronted by a proxy that
  # forwards X-Forwarded-Proto for probe traffic too — see config/settings/production.py).
  secureSslRedirect: false
  otel:
    enabled: false
    serviceName: "classic-models-api"
    endpoint: ""
    protocol: "http/protobuf"

route:
  enabled: true
  host: "" # leave empty to let OpenShift assign one

# Gateway API HTTPRoute, for clusters with the Gateway API CRDs and an
# implementation installed — e.g. Envoy Gateway, or OpenShift 4.14+'s native
# Gateway API support. Requires a Gateway resource to already exist on the
# cluster — this chart does not create the Gateway itself. Independent of
# `route` above: enable either, both, or neither depending on what the
# target cluster supports.
httpRoute:
  enabled: false
  # Hostnames the route answers for. Leave empty to inherit the Gateway
  # listener's hostname (if any).
  hostnames: []
  # gateway.name: gateway.example.com
  gateway:
    name: ""
    namespace: "" # empty = same namespace as this release
    sectionName: "" # optional: target a specific listener on the Gateway
  path: /
  pathType: PathPrefix

mysql:
  image:
    repository: registry.redhat.io/rhel8/mysql-80
    tag: latest
    pullPolicy: IfNotPresent
  database: classicmodels
  user: classicuser
  storage:
    size: 5Gi
    storageClassName: "" # empty = cluster default
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Secrets are auto-generated on first install (see templates/api/secret.yaml and
# templates/mysql/secret.yaml) and preserved across upgrades via `lookup`.
# Override any of these to pin specific values instead (e.g. for a restore).
secrets:
  secretKey: ""
  apiKey: ""
  mysqlRootPassword: ""
  mysqlPassword: ""
  jwtPrivateKeyPem: ""
  jwtPublicKeyPem: ""
